<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Battleship 1942</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
  @font-face { font-family:"Press Start 2P"; src:url(font.woff2) format("woff2"); font-display:swap; }
  :root { --ink:#0b1020; --yellow:#ffe94a; --red:#ff3b4e; --cyan:#7fe9ff; --white:#fdfdf5; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none; }
  body { font-family:"Press Start 2P",monospace; color:var(--white); user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; inset:0; touch-action:none; cursor:crosshair; }
  #c { width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #crt { position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.07) 2px 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,10,.5) 100%); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }

  .hud { position:absolute; pointer-events:none; text-shadow:2px 2px 0 var(--ink); font-size:clamp(9px,1.6vw,15px); line-height:1.7; }
  .hud small { display:block; color:var(--red); font-size:.8em; }
  #hudL { top:12px; left:14px; }
  #hudC { top:12px; left:50%; transform:translateX(-50%); text-align:center; }
  #hudR { top:12px; right:14px; text-align:right; }
  #hudB { bottom:14px; left:14px; color:var(--yellow); }
  #hudB span { margin-right:1.4em; white-space:nowrap; }
  #lives { color:var(--red); font-family:system-ui,sans-serif; font-size:1.9em; letter-spacing:.12em; vertical-align:middle; line-height:1; }
  #bossWrap { position:absolute; top:62px; left:50%; transform:translateX(-50%); width:min(60vw,420px); display:none; pointer-events:none; text-align:center; font-size:clamp(8px,1.2vw,11px); color:var(--red); text-shadow:2px 2px 0 var(--ink); }
  #bossBar { margin-top:6px; height:12px; border:3px solid var(--white); background:var(--ink); }
  #bossFill { height:100%; width:100%; background:var(--red); }

  #banner { position:absolute; top:34%; left:0; right:0; text-align:center; pointer-events:none; font-size:clamp(16px,4vw,38px); color:var(--yellow); text-shadow:4px 4px 0 var(--ink); opacity:0; }

  .btn { position:absolute; font:inherit; color:var(--white); background:rgba(11,16,32,.72); border:3px solid var(--white); padding:10px 12px; font-size:clamp(9px,1.3vw,12px); cursor:pointer; }
  .btn:active { background:var(--red); }
  .btn:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
  #btnBomb { right:16px; bottom:16px; padding:20px 18px; border-color:var(--yellow); color:var(--yellow); display:none; }
  #btns { position:absolute; right:14px; top:62px; display:flex; gap:8px; align-items:stretch; }
  #btns .btn { position:static; white-space:nowrap; }
  #btnPause { display:none; }
  #opts { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(5,8,25,.72); z-index:5; }
  #opts.hidden { display:none; }
  #opts .box { display:flex; flex-direction:column; gap:14px; padding:26px 28px; border:4px solid var(--white); background:#0b1020; min-width:min(84vw,340px); text-align:center; }
  #opts .oh { color:var(--yellow); font-size:clamp(14px,2.4vw,22px); margin-bottom:8px; text-shadow:3px 3px 0 var(--red); }
  #opts .btn { position:static; padding:16px 14px; font-size:clamp(10px,1.5vw,14px); }
  #opts .btn.off { color:#8b93a8; border-color:#8b93a8; }
  #opts .hint { font-size:clamp(7px,1vw,10px); color:#8b93a8; line-height:1.8; }

  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; align-items:center; text-align:center; padding:9vh 16px 7vh; pointer-events:none; }
  #overlay.hidden { display:none; }
  #overlay.dim { background:rgba(5,8,25,.6); justify-content:center; gap:4vh; }
  .title { font-size:clamp(26px,7.4vw,84px); line-height:1.1; margin:0; color:var(--yellow); letter-spacing:.02em;
    text-shadow:4px 4px 0 var(--red), 8px 8px 0 var(--ink); }
  .sub { margin-top:16px; font-size:clamp(10px,2vw,20px); color:var(--cyan); text-shadow:3px 3px 0 var(--ink); }
  .start { font-size:clamp(11px,2.2vw,22px); text-shadow:3px 3px 0 var(--ink); animation:blink 1s steps(2) infinite; }
  .help { margin-top:20px; font-size:clamp(8px,1.25vw,13px); line-height:2.1; text-shadow:2px 2px 0 var(--ink); }
  .help b { color:var(--yellow); font-weight:400; }
  .big { font-size:clamp(22px,6vw,56px); color:var(--red); text-shadow:4px 4px 0 var(--ink); margin:0; }
  .final { font-size:clamp(11px,2.2vw,20px); line-height:2.2; text-shadow:3px 3px 0 var(--ink); }
  .final em { color:var(--yellow); font-style:normal; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .start { animation:none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="crt"></div>
  <div id="flash"></div>

  <div class="hud" id="hudL"><small>1UP</small><span id="score">0000000</span></div>
  <div class="hud" id="hudC"><small>HI-SCORE</small><span id="hi">0000000</span></div>
  <div class="hud" id="hudR"><small>STAGE</small><span id="stageNo">1</span></div>
  <div class="hud" id="hudB"><span id="lives">♥♥♥</span><span id="bombs">BOMB[B] x2</span><span id="pow">POW 1</span></div>
  <div id="bossWrap"><span id="bossName">WARNING</span><div id="bossBar"><div id="bossFill"></div></div></div>
  <div id="banner"></div>

  <div id="btns">
    <button class="btn" id="btnPause" aria-label="Pause">II</button>
    <button class="btn" id="btnOpt" aria-label="Options">OPTIONS</button>
  </div>
  <button class="btn" id="btnBomb" aria-label="Bomb">BOMB</button>

  <div id="opts" class="hidden" role="dialog" aria-label="Options">
    <div class="box">
      <div class="oh">OPTIONS</div>
      <button class="btn" id="oMusic">MUSIC: ON</button>
      <button class="btn" id="oSfx">SOUND FX: ON</button>
      <button class="btn" id="oClose">CLOSE</button>
      <div class="hint">KEYS: M = MUSIC · N = SOUND FX</div>
    </div>
  </div>

  <div id="overlay">
    <div>
      <h1 class="title">BATTLESHIP</h1>
      <div class="sub">SEA STRIKE 1942</div>
    </div>
    <div>
      <div class="start">PRESS START</div>
      <div class="help">
        TAP THE SCREEN OR PRESS <b>ENTER</b><br>
        <b>ARROWS / WASD</b> MOVE AND FIRE · <b>B</b> KEY DROPS A BOMB · <b>P</b> PAUSE<br>
        TOUCH: <b>DRAG</b> TO MOVE, <b>BOMB</b> BUTTON
      </div>
    </div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var overlay = $('overlay');
  if (!window.THREE) {
    overlay.innerHTML = '<div class="help">COULD NOT LOAD THE 3D ENGINE.<br>CHECK YOUR CONNECTION AND RELOAD.</div>';
    return;
  }
  var T = THREE, renderer;
  try {
    renderer = new T.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
  } catch (err) {
    overlay.innerHTML = '<div class="help">THIS BROWSER DOES NOT SUPPORT WEBGL.</div>';
    return;
  }

  /* ---------- helpers ---------- */
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var PLANE_Y = 4.5, SEA_SPEED = 14, MAX_LIVES = 3;

  /* ---------- scene ---------- */
  var SKY = 0x9bb7d2;
  var scene = new T.Scene();
  scene.background = new T.Color(SKY);
  scene.fog = new T.Fog(SKY, 70, 185);
  var camera = new T.PerspectiveCamera(55, 1, 0.1, 500);
  var hemi = new T.HemisphereLight(0xffffff, 0x5a78c8, 0.95);
  scene.add(hemi);
  var sun = new T.DirectionalLight(0xffffff, 0.55);
  sun.position.set(6, 12, 8);
  scene.add(sun);

  var halfW = 16, xMax = 14;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.max(2, Math.round(h / 280));           // chunky arcade pixels
    renderer.setPixelRatio(1);
    renderer.setSize(Math.ceil(w / s), Math.ceil(h / s), false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 1 ? 75 : 55;
    camera.updateProjectionMatrix();
    halfW = 19.2 * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
    xMax = clamp((halfW - 1.5) / 0.4, 4, 15);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- "ink drawing" model kit ---------- */
  var INK = new T.LineBasicMaterial({ color: 0x0b1020 });
  var mats = {}, boxes = {}, basics = {};
  function mat(c) { return mats[c] || (mats[c] = new T.MeshLambertMaterial({ color: c })); }
  function basic(c) { return basics[c] || (basics[c] = new T.MeshBasicMaterial({ color: c })); }
  function box(w, h, d) { var k = w + '_' + h + '_' + d; return boxes[k] || (boxes[k] = new T.BoxGeometry(w, h, d)); }
  function part(parent, geo, color, x, y, z) {
    var m = new T.Mesh(geo, mat(color));
    if (!geo.userData.edges) geo.userData.edges = new T.EdgesGeometry(geo, 20);
    m.add(new T.LineSegments(geo.userData.edges, INK));
    m.position.set(x || 0, y || 0, z || 0);
    parent.add(m);
    return m;
  }

  /* ---------- the warship (from the drawing; bow points to -z) ---------- */
  var PAPER = 0xfdfdf5;
  var ship = new T.Group();
  (function buildShip() {
    var s = new T.Shape();
    s.moveTo(0, 4.8); s.lineTo(1.3, 2.6); s.lineTo(1.3, -3.8); s.lineTo(0.9, -4.5);
    s.lineTo(-0.9, -4.5); s.lineTo(-1.3, -3.8); s.lineTo(-1.3, 2.6); s.closePath();
    var hull = new T.ExtrudeGeometry(s, { depth: 1.5, bevelEnabled: false });
    var p = hull.attributes.position;
    for (var i = 0; i < p.count; i++) {                  // slanted bow & stern, like the sketch
      if (p.getZ(i) < 0.01) { p.setX(i, p.getX(i) * 0.62); p.setY(i, p.getY(i) * 0.84 - 0.15); }
    }
    hull.rotateX(-Math.PI / 2); hull.translate(0, -0.35, 0); hull.computeVertexNormals();
    var HULL = 0x3f7034, UPPER = 0x5f9149, DARK = 0x2c5226, GUN = 0x18301a;
    part(ship, hull, HULL, 0, 0, 0);
    var D = 1.15;                                         // deck height
    part(ship, box(2.4, 0.08, 6.2), 0x5c4a3a, 0, D + 0.04, 0.6);  // deck planking
    part(ship, box(2.66, 0.22, 6.3), 0x9b2f33, 0, 0.1, 0.6);      // red boot stripe at the waterline
    part(ship, box(1.5, 1.0, 1.5), DARK, 0, D + 0.5, -2.3);       // front gun turret
    part(ship, box(0.32, 0.32, 1.7), GUN, 0, D + 0.6, -3.85);     // gun barrel
    part(ship, box(2.0, 2.1, 2.4), UPPER, 0, D + 1.05, 0.4);      // bridge
    part(ship, box(2.06, 0.34, 2.46), 0x1d2733, 0, D + 1.6, 0.4); // bridge windows
    part(ship, box(1.1, 0.8, 1.1), DARK, 0, D + 2.5, 0.3);        // box on the bridge
    part(ship, box(2.3, 1.0, 2.6), UPPER, 0, D + 0.5, 2.9);       // raised rear deck
    part(ship, box(0.12, 2.3, 0.12), GUN, 0, D + 2.15, 2.0);      // flag pole
    ship.userData.flag = part(ship, box(0.06, 0.8, 1.2), PAPER, 0, D + 2.9, 2.66); // flag
  })();
  scene.add(ship);

  /* ---------- sea, islands, clouds ---------- */
  var seaTex = (function () {
    var cv = document.createElement('canvas'); cv.width = cv.height = 64;
    var g = cv.getContext('2d');
    g.fillStyle = '#1557c0'; g.fillRect(0, 0, 64, 64);
    for (var i = 0; i < 26; i++) {
      g.fillStyle = i % 3 ? '#2b78e4' : '#8fd0ff';
      g.fillRect((Math.random() * 60) | 0, (Math.random() * 64) | 0, 3 + ((Math.random() * 7) | 0), 1);
    }
    var t = new T.CanvasTexture(cv);
    t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(60, 60);
    t.magFilter = T.NearestFilter; t.minFilter = T.NearestFilter;
    return t;
  })();
  var sea = new T.Mesh(new T.PlaneGeometry(600, 600), new T.MeshBasicMaterial({ map: seaTex }));
  sea.rotation.x = -Math.PI / 2; sea.position.z = -120;
  scene.add(sea);

  var islands = [];
  function placeIsland(g, z) {
    var side = Math.random() < 0.5 ? -1 : 1;
    g.position.set(side * rand(26, 70), 0, z);
    var sc = rand(0.7, 1.8); g.scale.set(sc, rand(0.7, 1.5), sc);
  }
  for (var i = 0; i < 7; i++) {
    var isl = new T.Group();
    part(isl, new T.CylinderGeometry(7, 8.5, 0.6, 7), 0xf2dc8c, 0, 0.2, 0);
    part(isl, new T.ConeGeometry(5.5, 6, 6), 0x3fae4a, 0, 3.4, 0);
    part(isl, new T.ConeGeometry(2.8, 3.4, 5), 0x2c8f3c, 3.4, 2.1, 1.5);
    placeIsland(isl, -220 + i * 34);
    scene.add(isl); islands.push(isl);
  }
  for (var c = 0; c < 9; c++) {
    var cl = new T.Group(), cm = basic(0xdfe7ef);
    var a = new T.Mesh(box(16, 3, 4), cm), b = new T.Mesh(box(9, 3, 4), cm);
    b.position.set(rand(-3, 3), 2.4, 0); cl.add(a); cl.add(b);
    cl.position.set(rand(-150, 150), rand(26, 60), -175);
    cl.scale.setScalar(rand(0.8, 1.7));
    scene.add(cl);
  }

  /* ---------- stage themes: day, sunset, night, storm ---------- */
  var stars = (function () {
    var n = 160, p = new Float32Array(n * 3);
    for (var k = 0; k < n; k++) { p[k * 3] = rand(-230, 230); p[k * 3 + 1] = rand(24, 120); p[k * 3 + 2] = -180; }
    var g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(p, 3));
    var m = new T.Points(g, new T.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
    scene.add(m); return m;
  })();
  var THEMES = [
    { name: 'DAY',    sky: 0x9bb7d2, sea: 0xffffff, cloud: 0xdfe7ef, hemi: 0.95, sun: 0.55, stars: 0 },
    { name: 'SUNSET', sky: 0xe7a273, sea: 0xf2b0c8, cloud: 0xffd9b0, hemi: 0.85, sun: 0.6,  stars: 0 },
    { name: 'NIGHT',  sky: 0x131b3a, sea: 0x5a68a8, cloud: 0x2c3658, hemi: 0.6,  sun: 0.22, stars: 1 },
    { name: 'STORM',  sky: 0x6f7a85, sea: 0x9cc4b8, cloud: 0x8d969f, hemi: 0.78, sun: 0.3,  stars: 0 }
  ];
  THEMES.forEach(function (t) { t.skyC = new T.Color(t.sky); t.seaC = new T.Color(t.sea); t.cloudC = new T.Color(t.cloud); });
  var cloudMat = basic(0xdfe7ef);
  function updateTheme(dt, snap) {
    var t = THEMES[(stage - 1) % THEMES.length], k = snap ? 1 : 1 - Math.exp(-dt * 1.2);
    scene.background.lerp(t.skyC, k); scene.fog.color.copy(scene.background);
    sea.material.color.lerp(t.seaC, k); cloudMat.color.lerp(t.cloudC, k);
    hemi.intensity = lerp(hemi.intensity, t.hemi, k); sun.intensity = lerp(sun.intensity, t.sun, k);
    stars.material.opacity = lerp(stars.material.opacity, t.stars, k);
  }

  /* ---------- enemy models (nose points to +z) ---------- */
  function makePlane(body, accent) {
    var g = new T.Group();
    part(g, box(0.7, 0.7, 3.0), body, 0, 0, 0);
    part(g, box(4.4, 0.12, 1.0), accent, 0, 0.05, 0.3);
    part(g, box(1.6, 0.1, 0.6), accent, 0, 0.1, -1.3);
    part(g, box(0.1, 0.7, 0.6), body, 0, 0.5, -1.3);
    part(g, box(0.45, 0.3, 0.7), 0xbdf3ff, 0, 0.45, 0.25);
    g.userData.props = [part(g, box(1.6, 0.14, 0.06), 0x222222, 0, 0, 1.56)];
    return g;
  }
  var BOSSES = [
    { name: 'FLYING FORTRESS', hp: 70, r: 8.5, rz: 4.5 },
    { name: 'WAR ZEPPELIN',    hp: 95, r: 3.8, rz: 9 },
    { name: 'CRIMSON ACE',     hp: 60, r: 6.5, rz: 4.5 }
  ];
  function makeBoss(kind) {
    var g = new T.Group(), props = [];
    if (kind === 1) {                                     // airship
      part(g, box(4.4, 4.4, 15), 0xd8d0bc, 0, 1, 0);
      part(g, box(3.4, 3.4, 3), 0xc23a3a, 0, 1, 8.4);
      part(g, box(3, 3, 2.4), 0xb8b09c, 0, 1, -8.4);
      part(g, box(8.5, 0.3, 2.6), 0xc23a3a, 0, 1, -7.6);
      part(g, box(0.3, 7.5, 2.6), 0xc23a3a, 0, 1, -7.6);
      part(g, box(1.8, 1.3, 5), 0x4a4f5c, 0, -1.8, 1.5);
      [-3.2, 3.2].forEach(function (x) {
        part(g, box(0.9, 0.9, 1.9), 0x4a4f5c, x, -0.7, 0);
        props.push(part(g, box(2.2, 0.16, 0.06), 0x222222, x, -0.7, 1.05));
      });
    } else if (kind === 2) {                              // giant red ace
      g = makePlane(0xc8202c, 0x1b1b22); g.scale.setScalar(3.1); return g;
    } else {                                              // four-engine flying boat
      part(g, box(2.2, 2.2, 10), 0x7b8494, 0, 0, 0);
      part(g, box(19, 0.35, 2.8), 0x5d6675, 0, 1.2, 0.6);
      part(g, box(6.4, 0.25, 1.5), 0x5d6675, 0, 0.9, -4.4);
      part(g, box(0.25, 2.2, 1.6), 0xd8323f, 0, 1.7, -4.4);
      part(g, box(1.5, 0.7, 1.6), 0xbdf3ff, 0, 1.2, 3.6);
      [-6.4, -3.2, 3.2, 6.4].forEach(function (x) {
        part(g, box(0.9, 0.9, 1.9), 0xd8323f, x, 1.2, 1.7);
        props.push(part(g, box(2.0, 0.16, 0.06), 0x222222, x, 1.2, 2.7));
      });
    }
    g.userData.props = props;
    return g;
  }
  var shadowGeo = new T.CircleGeometry(1.6, 10);
  var shadowMat = new T.MeshBasicMaterial({ color: 0x06255c, transparent: true, opacity: 0.45, depthWrite: false });

  /* ---------- game state ---------- */
  var state = 'title', paused = false, time = 0, overAt = 0;
  var score = 0, hi = 0, stage = 1, stageTime = 0, spawnT = 1.5, kills = 0, nextExtend = 50000;
  var bossPhase = 0, bossWait = 0, boss = null;          // 0 none, 1 clearing skies, 2 boss fight
  var player = { x: 0, z: 1, cool: 0, power: 1, lives: 3, bombs: 2, inv: 0, bank: 0 };
  var pBullets = [], eBullets = [], enemies = [], bombs = [], parts = [], crates = [];
  var shake = 0, bannerT = 0, hudDirty = true;
  try { hi = +localStorage.getItem('gunham_hi') || 0; } catch (e) {}

  /* ---------- sound (tiny chip synth) ---------- */
  var AC = null, noiseBuf = null, masterG = null, sfxG = null, musG = null;
  var opt = { music: true, sfx: true };
  try { var so = JSON.parse(localStorage.getItem('bs_opt') || 'null'); if (so) { opt.music = so.music !== false; opt.sfx = so.sfx !== false; } } catch (e) {}
  function applyOpt(save) {
    if (AC) { sfxG.gain.value = opt.sfx ? 1 : 0; musG.gain.value = opt.music ? 1 : 0; }
    $('oMusic').textContent = 'MUSIC: ' + (opt.music ? 'ON' : 'OFF'); $('oMusic').className = 'btn' + (opt.music ? '' : ' off');
    $('oSfx').textContent = 'SOUND FX: ' + (opt.sfx ? 'ON' : 'OFF'); $('oSfx').className = 'btn' + (opt.sfx ? '' : ' off');
    if (save) try { localStorage.setItem('bs_opt', JSON.stringify(opt)); } catch (e) {}
  }
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.8, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      masterG = AC.createGain(); masterG.connect(AC.destination);
      sfxG = AC.createGain(); sfxG.connect(masterG);
      musG = AC.createGain(); musG.connect(masterG);
      applyOpt(false);
    } catch (e) { AC = null; }
  }
  function tone(f1, f2, dur, type, vol, delay, dest) {
    if (!AC) return;
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);

    try { stageEl.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stageEl.addEventListener('pointermove', function (ev) {
    if (!dragging || state !== 'play' || paused) return;
    var k = (2 * halfW / window.innerWidth) * 1.5;
    player.x = clamp(player.x + (ev.clientX - lastX) * k, -xMax, xMax);
    player.z = clamp(player.z + (ev.clientY - lastY) * k, -7, 4);
    player.bank = clamp(player.bank + (ev.clientX - lastX) * 0.02, -1, 1);
    lastX = ev.clientX; lastY = ev.clientY;
  });
  function endDrag() { dragging = false; }
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);
  stageEl.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

  function openOpts(on) {
    optsOpen = on; $('opts').className = on ? '' : 'hidden';
    if (on) { optsPaused = state === 'play' && !paused; if (optsPaused) togglePause(); }
    else if (optsPaused && paused) { optsPaused = false; togglePause(); }
  }
  $('btnOpt').addEventListener('click', function () { initAudio(); openOpts(!optsOpen); this.blur(); });
  $('oClose').addEventListener('click', function () { openOpts(false); });
  $('oMusic').addEventListener('click', function () { initAudio(); opt.music = !opt.music; applyOpt(true); });
  $('oSfx').addEventListener('click', function () { initAudio(); opt.sfx = !opt.sfx; applyOpt(true); if (opt.sfx) sfx.power(); });
  applyOpt(false);
  $('btnPause').addEventListener('click', function () { togglePause(); this.blur(); });
  $('btnBomb').addEventListener('click', function () { useBomb(); this.blur(); });

  /* ---------- update ---------- */
  var camPos = new T.Vector3(0, 7, 15), camLook = new T.Vector3(0, 1.5, 1), tmpP = new T.Vector3(), tmpL = new T.Vector3();

  function updatePlayer(dt) {
    var dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    var dz = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    player.x = clamp(player.x + dx * 14 * dt, -xMax, xMax);
    player.z = clamp(player.z + dz * 10 * dt, -7, 4);
    if (dx) player.bank = lerp(player.bank, dx, 1 - Math.exp(-dt * 8));
    else player.bank = lerp(player.bank, 0, 1 - Math.exp(-dt * 5));
    player.cool -= dt;
    if ((dx || dz || keys.Space || dragging) && player.cool <= 0) shoot();   // fires while a move key is held
    if (player.inv > 0) { player.inv -= dt; ship.visible = player.inv <= 0 || Math.floor(time * 16) % 2 === 0; }
    if (Math.random() < dt * 22) puff(player.x + rand(-1, 1), 0.15, player.z + 4.4, rand(-1, 1), 0, SEA_SPEED * 0.8, 0.7, 0xffffff, 0.9, false);
  }

  function wander(e, dt, speed) {                       // pick a fresh spot (either side, random distance and pace), glide there, repeat
    e.moveT -= dt;
    if (e.moveT <= 0 || Math.abs(e.goal - e.x) < 0.6) {
      var lim = xMax - 2.5, g = rand(-lim, lim);
      if (Math.abs(g - e.x) < 5) g = clamp(e.x + (Math.random() < 0.5 ? -1 : 1) * rand(6, 12), -lim, lim);
      if (Math.random() < 0.3) g = clamp(player.x + rand(-2, 2), -lim, lim);   // sometimes hunts the ship
      e.goal = g; e.moveT = rand(1.2, 3.2); e.pace = (rand(5, 11) + stage) * speed;
    }
    var bv = clamp((e.goal - e.x) * 2, -e.pace, e.pace);
    e.bvx = lerp(e.bvx, bv, 1 - Math.exp(-dt * 3)); e.x += e.bvx * dt;
    return -e.bvx * 0.02;
  }
  function updateBoss(e, dt) {
    var roll = 0, k, n;
    if (e.bm === 0 && e.z < -27) { e.z += 13 * dt; return 0; }           // flying in
    if (e.kind === 0) {                                   // FLYING FORTRESS: aimed fans + bombs
      roll = wander(e, dt, 1);
      e.fire -= dt;
      if (e.fire <= 0) {
        e.fire = Math.max(0.65, 1.5 - stage * 0.1); n = Math.min(9, 3 + Math.floor(stage / 2) * 2);
        for (k = 0; k < n; k++) fireAt(e.x, e.y - 0.5, e.z + 4, (k - (n - 1) / 2) * 0.2);
      }
      e.bombT -= dt;
      if (e.bombT <= 0) {
        e.bombT = Math.max(1.3, 2.7 - stage * 0.15);
        dropBomb(e.x, e.y - 1, e.z, clamp(player.x + rand(-2.5, 2.5), -xMax, xMax), player.z + rand(-2, 2));
      }
    } else if (e.kind === 1) {                            // WAR ZEPPELIN: slow, wide bullet curtains, launches escorts
      roll = wander(e, dt, 0.45) * 0.5;
      e.fire -= dt;
      if (e.fire <= 0) {
        e.fire = Math.max(0.95, 1.9 - stage * 0.08); e.alt = !e.alt; n = Math.min(11, 6 + Math.floor(stage / 2));
        for (k = 0; k < n; k++) fireAt(e.x, e.y - 1.5, e.z + 6, (k - (n - 1) / 2 + (e.alt ? 0.5 : 0)) * 0.3);
      }
      e.bombT -= dt;
      if (e.bombT <= 0) {
        e.bombT = Math.max(4, 7 - stage * 0.3);
        spawnEnemy('fighter', clamp(e.x - 7, -xMax, xMax), e.z + 3); spawnEnemy('fighter', clamp(e.x + 7, -xMax, xMax), e.z + 3);
        if (stage > 2) spawnEnemy('diver', e.x, e.z + 5);
      }
    } else if (e.bm === 0) {                              // CRIMSON ACE: fast, three-shot bursts, then a ramming dive
      roll = wander(e, dt, 1.7);
      e.fire -= dt;
      if (e.fire <= 0) {
        fireAt(e.x, e.y, e.z + 5, 0); e.burst++;
        if (e.burst >= 3) { e.burst = 0; e.fire = Math.max(0.8, 1.6 - stage * 0.06); } else e.fire = 0.14;
      }
      e.bombT -= dt;
      if (e.bombT <= 0) { e.bm = 1; e.lock = 0.8; e.tx = player.x; e.tz = player.z; e.ring = makeRing(e.tx, e.tz, 0xff2f3f, 2); tone(700, 1500, 0.5, 'sawtooth', 0.05); }
    } else if (e.bm === 1) {                              // locking on: ring shows where it will hit
      e.lock -= dt; roll = Math.sin(e.t * 45) * 0.25;
      if (e.ring) e.ring.material.opacity = 0.45 + 0.4 * Math.sin(time * 26);
      if (e.lock <= 0) { var ax = e.tx - e.x, az = e.tz - e.z, al = Math.hypot(ax, az) || 1; e.dvx = ax / al * 58; e.dvz = az / al * 58; e.z0 = e.z; e.bm = 2; }
    } else if (e.bm === 2) {                              // dive
      e.x += e.dvx * dt; e.z += e.dvz * dt;
      e.y = lerp(PLANE_Y + 1.5, 2.4, clamp((e.z - e.z0) / Math.max(1, e.tz - e.z0), 0, 1));
      if (Math.abs(e.x - player.x) < 4.6 && Math.abs(e.z - player.z) < 5.5) hurtPlayer();
      if (e.z > e.tz + 9) { e.bm = 3; if (e.ring) { scene.remove(e.ring); e.ring = null; } }
    } else {                                              // climb back to its station
      e.z -= 32 * dt; e.y = lerp(e.y, PLANE_Y + 1.5, 1 - Math.exp(-dt * 3));
      e.x = lerp(e.x, clamp(e.x, -xMax + 3, xMax - 3), 1 - Math.exp(-dt * 4));
      if (e.z <= -27) { e.z = -27; e.bm = 0; e.bombT = rand(3.2, 5.2); e.goal = e.x; e.bvx = 0; e.moveT = 0; }
    }
    return roll;
  }
  function updateEnemies(dt) {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i]; e.t += dt;
      var roll = 0;
      if (e.type === 'fighter') {
        e.z += (19 + stage * 2.4) * dt;
      } else if (e.type === 'diver') {                    // breaks formation, locks on, then rams in a straight line
        if (e.mode === 0) {
          e.z += (19 + stage * 2.4) * dt;
          if (e.z > -48 && state === 'play') {
            e.mode = 1; e.lock = 0.55; e.tx = player.x; e.tz = player.z;
            e.ring = new T.Mesh(ringGeo, new T.MeshBasicMaterial({ color: 0xffd23c, transparent: true, opacity: 0.8, depthWrite: false }));
            e.ring.rotation.x = -Math.PI / 2; e.ring.position.set(e.tx, 0.1, e.tz); scene.add(e.ring);
            tone(900, 1400, 0.3, 'sawtooth', 0.04);
          }
        } else if (e.mode === 1) {
          e.lock -= dt; e.z += 5 * dt; roll = Math.sin(e.t * 45) * 0.4;
          if (e.lock <= 0) {
            var ddx = e.tx - e.x, ddz = e.tz - e.z, dl = Math.hypot(ddx, ddz) || 1;
            e.mode = 2; e.dvx = ddx / dl * 50; e.dvz = ddz / dl * 50; e.z0 = e.z;
          }
        } else {
          e.x += e.dvx * dt; e.z += e.dvz * dt;
          e.y = lerp(PLANE_Y, 1.7, clamp((e.z - e.z0) / Math.max(1, e.tz - e.z0), 0, 1));
          roll = e.t * 14;
        }
        if (e.ring) e.ring.material.opacity = 0.45 + 0.4 * Math.sin(time * 26);
      } else if (e.type === 'ace') {
        e.z += (16 + stage * 1.2) * dt;
        e.x = clamp(e.x0 + Math.sin(e.t * 2.2 + e.ph) * 5.5, -xMax - 2, xMax + 2);
        roll = -Math.cos(e.t * 2.2 + e.ph) * 0.6;
      } else if (e.type === 'kami') {
        e.z += (24 + stage) * dt;
        if (e.z < player.z - 3) { var d = clamp(player.x - e.x, -1, 1); e.x += d * 8 * dt; roll = -d * 0.5; }
        e.y = lerp(PLANE_Y, 1.7, clamp((e.z + 34) / 30, 0, 1));
        if (Math.abs(e.x - player.x) < 2.2 && Math.abs(e.z - player.z) < 4.6) { hurtPlayer(); killEnemy(e); }
      } else if (e.type === 'bomber') {
        e.z += 9.5 * dt;
        e.bombT -= dt;
        if (e.bombT <= 0 && e.z > -55 && e.z < -6) {
          e.bombT = Math.max(0.9, 1.9 - stage * 0.15);
          dropBomb(e.x, e.y - 0.6, e.z, e.x + rand(-1.6, 1.6), e.z + 13 + rand(-1, 1));
        }
      } else if (e.type === 'boss') {
        roll = updateBoss(e, dt);
      }
      if (e.type === 'fighter' || e.type === 'ace') {
        e.fire -= dt;
        if (e.fire <= 0 && e.z > -62 && e.z < player.z - 12) {
          e.fire = Math.max(0.55, rand(1.5, 2.6) - stage * 0.25);
          if (stage >= 3) { fireAt(e.x, e.y, e.z + 1.5, -0.13); fireAt(e.x, e.y, e.z + 1.5, 0.13); }
          else fireAt(e.x, e.y, e.z + 1.5, 0);
        }
      }
      if (!e.dead && e.type !== 'boss' && e.type !== 'kami' && state === 'play' && player.inv <= 0 &&
          Math.abs(e.x - player.x) < e.r * 0.55 + 1.1 && Math.abs(e.z - player.z) < 4.4) {   // ramming costs a life
        hurtPlayer(); if (e.type === 'bomber') damage(e, 4); else killEnemy(e);
      }
      e.pop = Math.max(0, e.pop - dt * 8);
      e.g.position.set(e.x, e.y + Math.sin(e.t * 3 + e.ph) * 0.15, e.z);
      e.g.scale.setScalar(1 + e.pop * 0.18);
      e.body.rotation.z = roll;
      var pr = e.body.userData.props;
      for (var j = 0; j < pr.length; j++) pr[j].rotation.z += dt * 30;
      e.sh.position.set(e.x, 0.07, e.z);
      if (e.z > 20) e.dead = true;
    }
    for (i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) {
      if (enemies[i].ring) scene.remove(enemies[i].ring);
      scene.remove(enemies[i].g); scene.remove(enemies[i].sh); enemies.splice(i, 1);
    }
  }

  function updateBullets(dt) {
    var i, j, b;
    for (i = pBullets.length - 1; i >= 0; i--) {
      b = pBullets[i];
      b.x += b.vx * dt; b.z += b.vz * dt; b.d += 58 * dt;
      var hit = b.z < -84;
      for (j = 0; j < enemies.length && !hit; j++) {
        var e = enemies[j];
        if (!e.dead && Math.abs(b.x - e.x) < e.r && Math.abs(b.z - e.z) < e.rz + 0.6) {
          hit = true; damage(e, 1);
          if (!e.dead) { sfx.hit(); puff(b.x, e.y, b.z, rand(-2, 2), rand(2, 5), 6, 0.25, 0xfff2a0, 0.8, true); }
        }
      }
      if (hit) { scene.remove(b.m); pBullets.splice(i, 1); }
      else b.m.position.set(b.x, 1.9 + Math.min(1, b.d / 9) * (PLANE_Y - 1.9), b.z);
    }
    for (i = eBullets.length - 1; i >= 0; i--) {
      b = eBullets[i];
      b.x += b.vx * dt; b.z += b.vz * dt; b.y = Math.max(1.3, b.y - 3.2 * dt);
      b.m.position.set(b.x, b.y, b.z); b.m.rotation.y += dt * 9;
      var gone = b.z > 18 || Math.abs(b.x) > 45;
      if (!gone && b.y < 2.6 && Math.abs(b.x - player.x) < 1.05 && b.z > player.z - 3 && b.z < player.z + 3) {
        gone = true; hurtPlayer();
      }
      if (gone) { scene.remove(b.m); eBullets.splice(i, 1); }
    }
    for (i = bombs.length - 1; i >= 0; i--) {
      b = bombs[i]; b.t += dt;
      var u = Math.min(1, b.t / b.dur);
      b.m.position.set(lerp(b.fx, b.tx, u), b.fy * (1 - u * u), lerp(b.fz, b.tz, u));
      b.ring.material.opacity = 0.45 + 0.4 * Math.sin(time * 22);
      b.ring.scale.setScalar(1.5 - 0.5 * u);
      if (u >= 1) {
        splash(b.tx, b.tz); sfx.boom(false);
        if (Math.abs(b.tx - player.x) < 2.1 && Math.abs(b.tz - player.z) < 4.2) hurtPlayer();
        scene.remove(b.m); scene.remove(b.ring); bombs.splice(i, 1);
      }
    }
    for (i = crates.length - 1; i >= 0; i--) {
      var c = crates[i]; c.t += dt; c.z += 7 * dt;
      c.m.position.set(c.x, 1.1 + Math.sin(c.t * 4) * 0.25, c.z); c.m.rotation.y += dt * 2;
      var got = Math.abs(c.x - player.x) < 2.2 && Math.abs(c.z - player.z) < 5;
      if (got) {
        if (c.kind === 'P') { if (player.power < 4) player.power++; else addScore(1000); }
        else if (c.kind === 'B') player.bombs = Math.min(3, player.bombs + 1);
        else if (player.lives < MAX_LIVES) player.lives++;
        sfx.power(); hudDirty = true;
      }
      if (got || c.z > 20) { scene.remove(c.m); crates.splice(i, 1); }
    }
  }

  function updateParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.life -= dt;
      if (p.grav) p.vy -= 20 * dt;
      p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
      p.m.scale.setScalar(Math.max(0.01, p.size * p.life / p.max));
      if (p.life <= 0 || p.m.position.y < -0.5) { scene.remove(p.m); parts.splice(i, 1); }
    }
  }

  function updateDirector(dt) {
    if (bossPhase === 0) {
      stageTime += dt; spawnT -= dt;
      if (spawnT <= 0) { spawnWave(); spawnT = Math.max(0.5, 2.1 - stage * 0.3 - stageTime * 0.014); }
      if (stageTime > 42) { bossPhase = 1; bossWait = 3.5; banner('WARNING!!', 3); sfx.warn(); }
    } else if (bossPhase === 1) {
      bossWait -= dt;
      if (bossWait <= 0) {
        boss = spawnEnemy('boss', 0, -110); bossPhase = 2; boss.bombT = rand(2.5, 4);
        $('bossName').textContent = BOSSES[boss.kind].name;
        el.bossFill.style.width = '100%'; el.bossWrap.style.display = 'block';
      }
    }
  }

  function updateWorld(dt) {
    seaTex.offset.y += SEA_SPEED * dt / 10;
    for (var i = 0; i < islands.length; i++) {
      islands[i].position.z += SEA_SPEED * dt;
      if (islands[i].position.z > 40) placeIsland(islands[i], -210 - rand(0, 30));
    }
    var bob = Math.sin(time * 2.2) * 0.09;
    ship.position.set(player.x, bob, player.z);
    ship.rotation.z = -player.bank * 0.2;
    ship.rotation.x = Math.sin(time * 1.6) * 0.025;
    ship.rotation.y = -player.bank * 0.12;
    ship.userData.flag.rotation.y = Math.sin(time * 7) * 0.22;
  }

  function updateCamera(dt) {
    if (state === 'title') {
      var a = time * 0.45;
      tmpP.set(player.x + Math.sin(a) * 13.5, 6.5, player.z + Math.cos(a) * 13.5); tmpL.set(player.x, 1.6, player.z);
    } else {
      tmpP.set(player.x * 0.6, 12, 20); tmpL.set(player.x * 0.6, 2, -15);
    }
    var k = 1 - Math.exp(-dt * (state === 'title' ? 20 : 4));
    camPos.lerp(tmpP, k); camLook.lerp(tmpL, k);
    camera.position.copy(camPos);
    if (shake > 0) {
      shake = Math.max(0, shake - dt * 1.6);
      camera.position.x += rand(-1, 1) * shake * 0.6; camera.position.y += rand(-1, 1) * shake * 0.6;
    }
    camera.lookAt(camLook);
  }

  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!paused) {
      time += dt;
      if (state === 'play') { updatePlayer(dt); updateDirector(dt); }
      updateEnemies(dt); updateBullets(dt); updateParts(dt); updateWorld(dt);
      if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) el.banner.style.opacity = 0; }
    }
    updateCamera(dt); updateTheme(dt); music();
    if (hudDirty) drawHud();
    renderer.render(scene, camera);
  }
  drawHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
